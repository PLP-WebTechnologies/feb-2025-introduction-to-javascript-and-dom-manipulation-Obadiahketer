<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Interactive Web Page</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <h1>Interactive Web Page</h1>
    <p>This webpage demonstrates interactive functionality with JavaScript!</p>
  </header>

  <!-- Section for Changing Text -->
  <section id="text-change-section">
    <h2>Change Text Content</h2>
    <p id="dynamic-text">Click the button below to change this text.</p>
    <button id="change-text">Change Text</button>
  </section>

  <!-- Section for Changing Styles -->
  <section id="style-change-section">
    <h2>Change Styles</h2>
    <p id="style-text">Click the button to change my style!</p>
    <button id="change-style">Change Style</button>
  </section>

  <!-- Section for Adding and Removing Elements -->
  <section id="add-remove-section">
    <h2>Add/Remove Elements</h2>
    <button id="add-element">Add Element</button>
    <button id="remove-element">Remove Element</button>
  </section>

  <footer>
    <p>&copy; 2025 Interactive Web Page</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
